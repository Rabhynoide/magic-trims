appId: fr.magictrims.app
productName: Magic Trims
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: MagicTrims-Setup-${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Magic Trims
# Mises à jour automatiques : l'appli installée cherche les nouvelles versions
# dans les GitHub Releases du dépôt (publiées par la CI à chaque fusion sur main).
publish:
  provider: github
  owner: Rabhynoide
  repo: magic-trims
  releaseType: release
