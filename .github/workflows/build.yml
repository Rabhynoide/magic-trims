name: Tests et installateur Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test

  installateur-windows:
    runs-on: windows-latest
    needs: tests
    # Publier une release (mise à jour automatique des applis installées).
    permissions:
      contents: write
    env:
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sur main, chaque passage reçoit un numéro de version qui augmente
      # (0.1.<numéro du passage>) : les applis installées la verront comme
      # une mise à jour.
      - name: Numéro de version
        if: env.PUBLIER == 'true'
        run: npm pkg set version=0.1.${{ github.run_number }} -w @magic-trims/app
      - name: Installateur
        if: env.PUBLIER != 'true'
        run: npm run dist
      - name: Installateur et publication de la release
        if: env.PUBLIER == 'true'
        working-directory: packages/app
        run: npx electron-vite build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: MagicTrims-installateur-windows
          path: packages/app/release/*.exe
          if-no-files-found: error
